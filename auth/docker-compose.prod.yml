# ============================================================
# Keycloak-Stack für den Produktivbetrieb (z. B. Hetzner Cloud).
#
# Unterschiede zur Entwicklungsdatei `docker-compose.yml`:
#   - `start` statt `start-dev` (Produktionsmodus, strenger Hostname)
#   - Caddy davor: HTTPS mit automatischem Let's-Encrypt-Zertifikat
#   - kein Mailpit: E-Mails gehen über echten SMTP
#   - Keycloak und Postgres sind NICHT von außen erreichbar
#   - importiert `realm-generated/`, erzeugt von hetzner-setup.sh
#
# Starten:  ./auth/hetzner-setup.sh auth.deine-domain.de mail@deine-domain.de
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sq-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD fehlt in auth/.env}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sq-keycloak
    # `start` baut beim ersten Hochfahren automatisch (dauert ~1 Minute).
    # Für schnellere Neustarts später auf ein eigenes Image mit
    # `kc.sh build` + `start --optimized` wechseln.
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Erst-Administrator der Keycloak-Konsole. Wirkt nur beim allerersten
      # Start; danach ist der Wert wirkungslos.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:?KC_ADMIN fehlt in auth/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD fehlt in auth/.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Öffentliche Adresse. Keycloak baut daraus alle Links in E-Mails
      # und die Endpunkte im Discovery-Dokument.
      KC_HOSTNAME: https://${KC_PUBLIC_HOST:?KC_PUBLIC_HOST fehlt in auth/.env}
      KC_HOSTNAME_STRICT: "true"
      # TLS endet bei Caddy, intern bleibt es HTTP im Docker-Netz.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: info
      # Beim Import verwendetes Secret des Backend-Clients
      PLATFORM_BACKEND_SECRET: ${PLATFORM_BACKEND_SECRET:?PLATFORM_BACKEND_SECRET fehlt in auth/.env}
    volumes:
      # Vorbereitete Realm-Definition (echte Domains + echter SMTP).
      # Wird nur beim allerersten Start importiert.
      - ./realm-generated/serviceq-realm.json:/opt/keycloak/data/import/serviceq-realm.json:ro
      - ./themes/groupit:/opt/keycloak/themes/groupit:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    # Bewusst kein `ports:` – erreichbar nur über Caddy.
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: sq-caddy
    depends_on:
      - keycloak
    ports:
      - "80:80"
      - "443:443"
    environment:
      KC_PUBLIC_HOST: ${KC_PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL fehlt in auth/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # Zertifikate – dieses Volume nicht löschen
      - caddy-config:/config
    restart: unless-stopped

volumes:
  keycloak-db:
  caddy-data:
  caddy-config:
