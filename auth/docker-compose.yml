# ============================================================
# Keycloak-Stack für die ServiceQ Lernplattform
#
# Starten:   cd auth && docker compose up -d
# Keycloak:  http://localhost:8080   (Admin-Konsole)
# Mailpit:   http://localhost:8025   (E-Mail-Postfach der Entwicklung)
#
# Der Realm `serviceq` wird beim ersten Start automatisch importiert –
# inklusive Rollen, Clients, SMTP-Konfiguration und Administrator-Konto
# (Zugangsdaten siehe docs/keycloak-setup.md).
#
# ⚠️  Diese Datei ist für Entwicklung und Abnahme. Für Produktion:
#     - `start --optimized` hinter einem TLS-Terminator (nicht start-dev)
#     - echte SMTP-Zugangsdaten statt Mailpit
#     - Passwörter und Secrets aus einem Secret Store
#     - Postgres mit Backup und persistentem Volume
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sq-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak-dev-passwort}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # SMTP-Auffangserver für die Entwicklung: Keycloak versendet echte Mails,
  # sie landen aber im Webpostfach unter http://localhost:8025 statt beim Empfänger.
  mailpit:
    image: axllent/mailpit:latest
    container_name: sq-mailpit
    ports:
      - "8025:8025"   # Weboberfläche
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sq-keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Erst-Administrator der Keycloak-Instanz selbst (nicht des Realms)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD fehlt in auth/.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak-dev-passwort}
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      # Beim Import verwendetes Secret des Backend-Clients
      PLATFORM_BACKEND_SECRET: ${PLATFORM_BACKEND_SECRET:?PLATFORM_BACKEND_SECRET fehlt in auth/.env}
    ports:
      - "8080:8080"
    volumes:
      # Realm-Definition (wird nur beim ersten Start importiert)
      - ./realm/serviceq-realm.json:/opt/keycloak/data/import/serviceq-realm.json:ro
      # Eigenes Theme für Login und E-Mails im GroupIT-Design
      - ./themes/groupit:/opt/keycloak/themes/groupit:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  keycloak-db:
