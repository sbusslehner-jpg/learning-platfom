# ============================================================
# GroupIT Login-Theme für die ServiceQ Lernplattform
#
# Bewusst minimal: die vollständige Anmeldeoberfläche kommt von
# keycloak.v2, dieses Theme legt ausschließlich die Markenfarben darüber.
#
# WICHTIG: `styles` wird nicht zusammengeführt, sondern überschrieben.
# Das Stylesheet des Eltern-Themes (css/styles.css aus keycloak.v2)
# muss deshalb weiterhin aufgeführt bleiben – css/login.css folgt
# dahinter und gewinnt damit bei gleicher Spezifität.
# ============================================================

parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/login.css

# muss zu supportedLocales im Realm passen (auth/realm/serviceq-realm.json)
locales=de,en,fr

meta=viewport==width=device-width,initial-scale=1
