# ============================================================
# GroupIT E-Mail-Theme fuer die ServiceQ Lernplattform
#
# parent=base  -> Basis-Templates bleiben als Rueckfall erhalten
#                 (z. B. text/email-test.ftl, identity-provider-link.ftl,
#                 event-*.ftl), die dieses Theme nicht selbst ueberschreibt.
#                 Die Nachrichtenbuendel werden mit dem Basis-Buendel
#                 zusammengefuehrt; eigene Schluessel gewinnen.
#
# locales      -> muss zu supportedLocales im Realm passen
#                 (auth/realm/serviceq-realm.json: de, en, fr; Standard de).
#                 Keycloak waehlt das Buendel nach dem Attribut `locale`
#                 des Benutzers, sonst nach defaultLocale des Realms.
# ============================================================

parent=base

locales=de,en,fr
