# ============================================================
# GroupIT E-Mail-Theme für die ServiceQ Lernplattform
#
# parent=base  -> Basis-Templates bleiben als Rückfall erhalten
#                 (z. B. text/email-test.ftl, identity-provider-link.ftl,
#                 event-*.ftl), die dieses Theme nicht selbst überschreibt.
#                 Die Nachrichtenbündel werden mit dem Basis-Bündel
#                 zusammengeführt; eigene Schlüssel gewinnen.
#
# locales      -> muss zu supportedLocales im Realm passen
#                 (auth/realm/serviceq-realm.json: de, en, fr; Standard de).
#                 Keycloak wählt das Bündel nach dem Attribut `locale`
#                 des Benutzers, sonst nach defaultLocale des Realms.
# ============================================================

parent=base

locales=de,en,fr
