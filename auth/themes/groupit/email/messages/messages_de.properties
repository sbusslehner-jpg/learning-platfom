# ============================================================
# GroupIT E-Mail-Theme – Deutsch (Standardsprache des Realms serviceq)
#
# Hinweise:
#  * Keycloak liest Theme-Nachrichten als UTF-8. Umlaute und Sonderzeichen
#    stehen daher direkt im Text, Unicode-Escapes sind nicht erforderlich.
#  * Alle Werte laufen durch java.text.MessageFormat. Ein einzelnes
#    Apostroph muss deshalb verdoppelt werden (''), geschweifte Klammern
#    sind zu vermeiden. {0} ist der jeweils eingesetzte Parameter.
#  * Mehrzeilige Werte werden mit einem \ am Zeilenende fortgesetzt.
# ============================================================

# --- Betreffzeilen (Schlüssel sind von Keycloak fest vorgegeben) ---
# Betreffe erhalten keine Parameter, der Produktname steht darum fest im Text.
executeActionsSubject=Ihr Zugang zur ServiceQ Lernplattform
emailVerificationSubject=Bitte bestätigen Sie Ihre E-Mail-Adresse
passwordResetSubject=Neues Passwort für die ServiceQ Lernplattform
emailTestSubject=Testnachricht der ServiceQ Lernplattform

# Reine Textfassung der Testnachricht (Vorlage stammt aus dem Basis-Theme)
emailTestBody=Dies ist eine Testnachricht. Der Mailversand von Keycloak ist korrekt konfiguriert.
emailTestBodyHtml=<p>Dies ist eine Testnachricht. Der Mailversand von Keycloak ist korrekt konfiguriert.</p>

# --- Gültigkeitsdauer des Links (wird von linkExpirationFormatter genutzt) ---
linkExpirationFormatter.timePeriodUnit.seconds=Sekunden
linkExpirationFormatter.timePeriodUnit.seconds.1=Sekunde
linkExpirationFormatter.timePeriodUnit.minutes=Minuten
linkExpirationFormatter.timePeriodUnit.minutes.1=Minute
linkExpirationFormatter.timePeriodUnit.hours=Stunden
linkExpirationFormatter.timePeriodUnit.hours.1=Stunde
linkExpirationFormatter.timePeriodUnit.days=Tage
linkExpirationFormatter.timePeriodUnit.days.1=Tag

