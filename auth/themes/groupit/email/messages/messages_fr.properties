# ============================================================
# GroupIT email theme – Français
#
# Remarques :
#  * Keycloak lit les fichiers de messages en UTF-8, les séquences
#    d'échappement Unicode ne sont donc pas nécessaires.
#  * Chaque valeur passe par java.text.MessageFormat : une apostrophe
#    littérale doit être doublée ('') et les accolades sont à éviter.
#    {0} correspond au paramètre transmis par le modèle.
#  * Les valeurs sur plusieurs lignes se poursuivent avec un \ final.
# ============================================================

# --- Objets des messages (clés imposées par Keycloak) ---
executeActionsSubject=Votre accès à la plateforme d''apprentissage ServiceQ
emailVerificationSubject=Veuillez confirmer votre adresse e-mail
passwordResetSubject=Nouveau mot de passe pour la plateforme d''apprentissage ServiceQ
emailTestSubject=Message de test de la plateforme d''apprentissage ServiceQ

# Version texte du message de test (le modèle provient du thème de base)
emailTestBody=Ceci est un message de test. L''envoi de courriels par Keycloak est correctement configuré.
emailTestBodyHtml=<p>Ceci est un message de test. L''envoi de courriels par Keycloak est correctement configuré.</p>

# --- Durée de validité du lien (utilisée par linkExpirationFormatter) ---
linkExpirationFormatter.timePeriodUnit.seconds=secondes
linkExpirationFormatter.timePeriodUnit.seconds.1=seconde
linkExpirationFormatter.timePeriodUnit.minutes=minutes
linkExpirationFormatter.timePeriodUnit.minutes.1=minute
linkExpirationFormatter.timePeriodUnit.hours=heures
linkExpirationFormatter.timePeriodUnit.hours.1=heure
linkExpirationFormatter.timePeriodUnit.days=jours
linkExpirationFormatter.timePeriodUnit.days.1=jour

# --- Marque et cadre ---
sqHtmlLang=fr
sqBrandEyebrow=After Sales IT
sqProductLabel=Plateforme d''apprentissage ServiceQ
sqGreeting=Bonjour {0},
sqGreetingNeutral=Bonjour,

# --- Invitation : requiredActions contient UPDATE_PASSWORD ---
sqInviteEyebrow=Invitation
sqInvitePreheader=Définissez votre mot de passe et commencez vos formations.
sqInviteHeadline=Votre accès à {0}
sqInviteIntro=un compte utilisateur a été créé pour vous sur {0}. \
Le bouton ci-dessous vous permet de définir votre mot de passe personnel et de \
terminer la configuration. Un mot de passe n''est jamais envoyé par courriel.
sqInviteButton=Configurer l''accès

# --- Invitation : seule l''action VERIFY_EMAIL est demandée ---
sqVerifyPreheader=Veuillez confirmer votre adresse e-mail.
sqVerifyHeadline=Confirmer votre adresse e-mail
sqVerifyIntro=veuillez confirmer votre adresse e-mail pour {0}. \
Nous nous assurons ainsi que les informations sur vos formations vous parviennent.
sqVerifyButton=Confirmer l''adresse e-mail
sqVerifyIgnore=Si vous n''attendiez pas cette confirmation, veuillez ignorer ce message.

# --- Invitation : autres actions ou actions inconnues ---
sqUpdatePreheader=Votre compte utilisateur doit être mis à jour.
sqUpdateHeadline=Mise à jour de votre compte utilisateur
sqUpdateIntro=votre compte utilisateur sur {0} doit être mis à jour. \
Le bouton ci-dessous vous permet d''effectuer les étapes nécessaires.
sqUpdateButton=Mettre à jour le compte

# --- Nouveau mot de passe ---
sqResetPreheader=Définissez un nouveau mot de passe.
sqResetHeadline=Définir un nouveau mot de passe
sqResetIntro=un nouveau mot de passe a été demandé pour votre compte utilisateur sur {0}. \
Le bouton ci-dessous vous permet de définir un nouveau mot de passe.
sqResetButton=Définir un nouveau mot de passe
sqResetIgnore=Si vous n''êtes pas à l''origine de cette demande, veuillez ignorer ce message. \
Votre mot de passe actuel reste valable et inchangé.

# --- Lien, validité, solution de repli ---
# Libellé placé devant l'adresse brute dans la version texte
# (typographie française : espace avant le deux-points)
sqTextLinkLabel={0} :
sqLinkExpiry=Le lien est valable {0}.
sqLinkFallbackIntro=Si le bouton ne fonctionne pas, copiez cette adresse dans la barre d''adresse de votre navigateur :
sqAccountNote=Ce lien est valable uniquement pour le compte utilisateur {0}. Merci de ne pas le transmettre.

# --- Étapes déduites de requiredActions ---
sqStepsTitle=Les étapes que vous allez suivre
sqActionUpdatePassword=Définir un mot de passe personnel
sqActionVerifyEmail=Confirmer votre adresse e-mail
sqActionUpdateProfile=Vérifier vos données personnelles
sqActionConfigureTotp=Configurer l''authentification à deux facteurs
sqActionTerms=Accepter les conditions d''utilisation
sqStepsOutro=Vous aurez ensuite accès à toutes les formations publiées pour votre marché.

# --- Message de test SMTP ---
sqTestPreheader=Message de test envoyé depuis la console d''administration.
sqTestHeadline=Test SMTP réussi
sqTestIntro=ce message a été envoyé depuis la console d''administration du realm {0}. \
Si vous le lisez, l''envoi de courriels est correctement configuré.
sqTestHint=Ce message sert uniquement au contrôle technique et n''exige aucune action.

# --- Pied de page ---
sqFooterAuto=Ce message a été envoyé automatiquement.
sqFooterNoReply=Il n''est pas possible de répondre à cette adresse.
sqFooterLegal=GroupIT – After Sales IT · Porsche Konstruktionen GmbH & Co KG
