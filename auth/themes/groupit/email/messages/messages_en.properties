# ============================================================
# GroupIT email theme – English
#
# Notes:
#  * Keycloak reads theme messages as UTF-8, so no unicode escapes are needed.
#  * Every value is processed by java.text.MessageFormat: a literal
#    apostrophe must be doubled ('') and curly braces must be avoided.
#    {0} is the parameter passed in from the template.
#  * Multi-line values continue with a trailing \.
#  * This bundle is also the last-resort fallback of the base theme,
#    therefore every key of messages_de.properties exists here as well.
# ============================================================

# --- Subjects (keys are fixed by Keycloak) ---
executeActionsSubject=Your access to the ServiceQ learning platform
emailVerificationSubject=Please confirm your email address
passwordResetSubject=New password for the ServiceQ learning platform
emailTestSubject=Test message from the ServiceQ learning platform

# Plain text body of the test message (template comes from the base theme)
emailTestBody=This is a test message. Keycloak mail delivery is configured correctly.
emailTestBodyHtml=<p>This is a test message. Keycloak mail delivery is configured correctly.</p>

# --- Link lifetime (used by linkExpirationFormatter) ---
linkExpirationFormatter.timePeriodUnit.seconds=seconds
linkExpirationFormatter.timePeriodUnit.seconds.1=second
linkExpirationFormatter.timePeriodUnit.minutes=minutes
linkExpirationFormatter.timePeriodUnit.minutes.1=minute
linkExpirationFormatter.timePeriodUnit.hours=hours
linkExpirationFormatter.timePeriodUnit.hours.1=hour
linkExpirationFormatter.timePeriodUnit.days=days
linkExpirationFormatter.timePeriodUnit.days.1=day

# --- Brand and frame ---
sqHtmlLang=en
sqBrandEyebrow=After Sales IT
sqProductLabel=ServiceQ learning platform
sqGreeting=Dear {0},
sqGreetingNeutral=Hello,

# --- Invitation: requiredActions contains UPDATE_PASSWORD ---
sqInviteEyebrow=Invitation
sqInvitePreheader=Set your password and start your training courses.
sqInviteHeadline=Your access to the {0}
sqInviteIntro=a user account has been created for you on the {0}. \
Use the button below to set your personal password and complete the setup. \
Passwords are never sent by email.
sqInviteButton=Set up access

# --- Invitation: only VERIFY_EMAIL requested ---
sqVerifyPreheader=Please confirm your email address.
sqVerifyHeadline=Confirm your email address
sqVerifyIntro=please confirm your email address for the {0}. \
This makes sure that notices about your training courses reach you.
sqVerifyButton=Confirm email address
sqVerifyIgnore=If you were not expecting this confirmation, please ignore this email.

# --- Invitation: other or unknown actions ---
sqUpdatePreheader=Your user account requires an update.
sqUpdateHeadline=Update of your user account
sqUpdateIntro=your user account on the {0} requires an update. \
Use the button below to complete the necessary steps.
sqUpdateButton=Update user account

# --- Password reset ---
sqResetPreheader=Set a new password.
sqResetHeadline=Set a new password
sqResetIntro=a new password has been requested for your user account on the {0}. \
Use the button below to set a new password.
sqResetButton=Set new password
sqResetIgnore=If you did not request this, please ignore this email. \
Your current password remains valid and unchanged.

# --- Link, lifetime, fallback ---
# Label in front of the raw address in the plain text version
sqTextLinkLabel={0}:
sqLinkExpiry=The link is valid for {0}.
sqLinkFallbackIntro=If the button does not work, copy this address into your browser''s address bar:
sqAccountNote=This link is valid for the user account {0} only. Please do not forward it.

# --- Steps derived from requiredActions ---
sqStepsTitle=These are the steps you will go through
sqActionUpdatePassword=Set a personal password
sqActionVerifyEmail=Confirm your email address
sqActionUpdateProfile=Review your personal details
sqActionConfigureTotp=Set up two-factor authentication
sqActionTerms=Accept the terms of use
sqStepsOutro=Afterwards all training courses released for your market are available to you.

# --- SMTP test message ---
sqTestPreheader=Test message from the administration console.
sqTestHeadline=SMTP test successful
sqTestIntro=this message was sent from the administration console of the realm {0}. \
If you can read it, mail delivery is configured correctly.
sqTestHint=This message is a technical check only and requires no action.

# --- Footer ---
sqFooterAuto=This email was sent automatically.
sqFooterNoReply=Replies to this address are not possible.
sqFooterLegal=GroupIT – After Sales IT · Porsche Konstruktionen GmbH & Co KG
