[build]
  command = "npm run build"
  publish = "dist"

# Serverseitige Auth-Funktionen (netlify/functions/*.mjs).
# esbuild bündelt die Abhängigkeiten (jose) und die gemeinsamen Module unter
# netlify/functions/_lib/ in das Deployment-Paket.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ─────────────────────────────────────────────────────────────────────────────
# Sicherheits-Header stehen NICHT hier, sondern werden beim Build nach
# `dist/_headers` geschrieben (siehe `securityHeadersPlugin` in vite.config.ts).
#
# Grund: Eine enge `connect-src` muss die konkreten Adressen von Keycloak und
# Supabase nennen. Statisch hinterlegt würde sie beim Domainwechsel veralten –
# und der Fehler wäre unangenehm: Der Browser blockiert die Verbindung zu
# Keycloak, die Anmeldung bricht ab, und sichtbar ist nur eine CSP-Meldung in
# der Konsole. Aus den Umgebungsvariablen erzeugt, folgt sie der Konfiguration.
#
# Zwei Quellen wären schlimmer als eine: Bei zwei CSP-Kopfzeilen erzwingt der
# Browser die Schnittmenge, was Fehlersuche unnötig verwirrend macht.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Auth-API (auth/README.md). Gleiche Domain wie die SPA: kein CORS, und die
# Keycloak-Client-Credentials bleiben serverseitig.
# Diese Redirects MÜSSEN vor dem SPA-Fallback stehen (Reihenfolge = Priorität),
# sonst liefert Netlify für /api/* die index.html aus.
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/api/auth/exchange"
  to = "/.netlify/functions/auth-exchange"
  status = 200

# Die spezifischere /resend-Route steht zuerst und zeigt auf dieselbe
# Funktion; diese unterscheidet die Routen anhand des Originalpfads.
[[redirects]]
  from = "/api/admin/invite/resend"
  to = "/.netlify/functions/admin-invite"
  status = 200

[[redirects]]
  from = "/api/admin/invite"
  to = "/.netlify/functions/admin-invite"
  status = 200

[[redirects]]
  from = "/api/admin/user/reconcile"
  to = "/.netlify/functions/admin-user"
  status = 200

[[redirects]]
  from = "/api/admin/user/pending"
  to = "/.netlify/functions/admin-user"
  status = 200

[[redirects]]
  from = "/api/admin/user"
  to = "/.netlify/functions/admin-user"
  status = 200

# Mail-Einstellungen: lesen (GET), speichern (PUT), testen (POST /test).
# Wieder zuerst die spezifischere Route.
[[redirects]]
  from = "/api/admin/smtp/test"
  to = "/.netlify/functions/admin-smtp"
  status = 200

[[redirects]]
  from = "/api/admin/smtp"
  to = "/.netlify/functions/admin-smtp"
  status = 200

# Benachrichtigungen (R-09): Warteschlange abarbeiten bzw. Kennzahlen lesen.
[[redirects]]
  from = "/api/notify/status"
  to = "/.netlify/functions/notify"
  status = 200

[[redirects]]
  from = "/api/notify"
  to = "/.netlify/functions/notify"
  status = 200

# Medien (R-03): Regeln lesen, Upload anmelden, abgelegte Datei pruefen,
# kurzlebige Abrufadresse holen, loeschen. Wieder von speziell nach allgemein –
# die Funktion unterscheidet die Routen anhand des Originalpfads.
[[redirects]]
  from = "/api/media/policy"
  to = "/.netlify/functions/media"
  status = 200

[[redirects]]
  from = "/api/media/upload-url"
  to = "/.netlify/functions/media"
  status = 200

[[redirects]]
  from = "/api/media/finalize"
  to = "/.netlify/functions/media"
  status = 200

[[redirects]]
  from = "/api/media/url"
  to = "/.netlify/functions/media"
  status = 200

[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200

# ─────────────────────────────────────────────────────────────────────────────
# SSO Ein-Domain-Proxy (Option A / Integrationsschritt) — STANDARDMÄSSIG AUS.
#
# Damit das serverseitige Session-Cookie same-site ankommt, werden die
# Consume-/Session-Endpunkte unter DERSELBEN Domain wie die SPA bereitgestellt
# und per Proxy an die Supabase Edge Functions weitergereicht. Erst dadurch
# bindet das __Host-Cookie an die Netlify-Domain (nicht an *.supabase.co).
#
# Aktivieren: <PROJECT_REF> ersetzen und die vier Zeilen einkommentieren.
# Diese Redirects MÜSSEN vor dem SPA-Fallback stehen (Reihenfolge = Priorität).
# Zusätzlich in den Netlify-Env-Variablen setzen: VITE_ACADEMY_SESSION_URL=/sso/session
#
# [[redirects]]
#   from = "/sso/consume"
#   to = "https://<PROJECT_REF>.functions.supabase.co/academy-consume"
#   status = 200
#   force = true
#
# [[redirects]]
#   from = "/sso/session/*"
#   to = "https://<PROJECT_REF>.functions.supabase.co/academy-session/:splat"
#   status = 200
#   force = true
# ─────────────────────────────────────────────────────────────────────────────

# SPA-Fallback: alle übrigen Routen auf index.html (muss ZULETZT stehen)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
