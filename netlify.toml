[build]
  command = "npm run build"
  publish = "dist"

# Serverseitige Auth-Funktionen (netlify/functions/*.mjs).
# esbuild bündelt die Abhängigkeiten (jose) und die gemeinsamen Module unter
# netlify/functions/_lib/ in das Deployment-Paket.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ─────────────────────────────────────────────────────────────────────────────
# Auth-API (auth/README.md). Gleiche Domain wie die SPA: kein CORS, und die
# Keycloak-Client-Credentials bleiben serverseitig.
# Diese Redirects MÜSSEN vor dem SPA-Fallback stehen (Reihenfolge = Priorität),
# sonst liefert Netlify für /api/* die index.html aus.
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/api/auth/exchange"
  to = "/.netlify/functions/auth-exchange"
  status = 200

# Die spezifischere /resend-Route steht zuerst und zeigt auf dieselbe
# Funktion; diese unterscheidet die Routen anhand des Originalpfads.
[[redirects]]
  from = "/api/admin/invite/resend"
  to = "/.netlify/functions/admin-invite"
  status = 200

[[redirects]]
  from = "/api/admin/invite"
  to = "/.netlify/functions/admin-invite"
  status = 200

# ─────────────────────────────────────────────────────────────────────────────
# SSO Ein-Domain-Proxy (Option A / Integrationsschritt) — STANDARDMÄSSIG AUS.
#
# Damit das serverseitige Session-Cookie same-site ankommt, werden die
# Consume-/Session-Endpunkte unter DERSELBEN Domain wie die SPA bereitgestellt
# und per Proxy an die Supabase Edge Functions weitergereicht. Erst dadurch
# bindet das __Host-Cookie an die Netlify-Domain (nicht an *.supabase.co).
#
# Aktivieren: <PROJECT_REF> ersetzen und die vier Zeilen einkommentieren.
# Diese Redirects MÜSSEN vor dem SPA-Fallback stehen (Reihenfolge = Priorität).
# Zusätzlich in den Netlify-Env-Variablen setzen: VITE_ACADEMY_SESSION_URL=/sso/session
#
# [[redirects]]
#   from = "/sso/consume"
#   to = "https://<PROJECT_REF>.functions.supabase.co/academy-consume"
#   status = 200
#   force = true
#
# [[redirects]]
#   from = "/sso/session/*"
#   to = "https://<PROJECT_REF>.functions.supabase.co/academy-session/:splat"
#   status = 200
#   force = true
# ─────────────────────────────────────────────────────────────────────────────

# SPA-Fallback: alle übrigen Routen auf index.html (muss ZULETZT stehen)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
